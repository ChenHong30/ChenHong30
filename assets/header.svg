<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chen Hong">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="900" height="220" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <style>
    .name {
      font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 76px;
      letter-spacing: 2px;
      fill: url(#ink);
      fill-opacity: 0;
      stroke: #c7d2fe;
      stroke-width: 1.2px;
      stroke-dasharray: 1100;
      stroke-dashoffset: 1100;
      animation: draw 2.4s cubic-bezier(.65,0,.35,1) forwards, fillin 1.1s ease-out 1.7s forwards;
    }
    .tag {
      font-family: 'Fira Code', 'Consolas', 'SF Mono', monospace;
      font-size: 17px;
      letter-spacing: 1px;
      fill: #dbeafe;
      opacity: 0;
      animation: fade 1s ease-out 2.5s forwards;
    }
    .shineBar { animation: sweep 5s ease-in-out 1s infinite; }
    .dot { opacity: 0; }
    .d1 { animation: rise 6s ease-in 0s   infinite; }
    .d2 { animation: rise 7s ease-in 1.2s infinite; }
    .d3 { animation: rise 5.5s ease-in 2.1s infinite; }
    .d4 { animation: rise 8s ease-in 0.6s infinite; }
    .d5 { animation: rise 6.5s ease-in 3s  infinite; }
    .d6 { animation: rise 7.5s ease-in 1.7s infinite; }
    .wave1 { animation: drift 9s linear infinite; }
    .wave2 { animation: drift 13s linear infinite reverse; }
    .underline { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw2 1.4s ease-out 2.2s forwards; }

    @keyframes draw   { to { stroke-dashoffset: 0; } }
    @keyframes draw2  { to { stroke-dashoffset: 0; } }
    @keyframes fillin { to { fill-opacity: 1; } }
    @keyframes fade   { to { opacity: 1; } }
    @keyframes sweep  { 0% { transform: translateX(-260px); } 55%,100% { transform: translateX(1100px); } }
    @keyframes rise   { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 85% { opacity: .25; } 100% { transform: translateY(-150px); opacity: 0; } }
    @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  </style>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="900" height="220" fill="url(#bg)"/>

    <!-- soft moving waves at the bottom -->
    <g opacity="0.22">
      <path class="wave1" d="M-200 178 q 50 -26 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 V220 H-200 Z" fill="#ffffff"/>
      <path class="wave2" d="M-200 192 q 50 -22 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 V220 H-200 Z" fill="#a5b4fc"/>
    </g>

    <!-- floating particles -->
    <circle class="dot d1" cx="120" cy="200" r="3" fill="#ffffff"/>
    <circle class="dot d2" cx="300" cy="200" r="2.5" fill="#c7d2fe"/>
    <circle class="dot d3" cx="470" cy="200" r="3.5" fill="#ffffff"/>
    <circle class="dot d4" cx="640" cy="200" r="2" fill="#e9d5ff"/>
    <circle class="dot d5" cx="760" cy="200" r="3" fill="#ffffff"/>
    <circle class="dot d6" cx="840" cy="200" r="2.5" fill="#c7d2fe"/>

    <!-- name -->
    <text class="name" x="450" y="118" text-anchor="middle" filter="url(#glow)">Chen Hong</text>

    <!-- animated underline accent -->
    <path class="underline" d="M310 138 H590" stroke="url(#ink)" stroke-width="3" stroke-linecap="round"/>

    <!-- tagline -->
    <text class="tag" x="450" y="172" text-anchor="middle">AI Researcher · Efficient LLMs</text>

    <!-- light sweep -->
    <g clip-path="url(#round)">
      <rect class="shineBar" x="-120" y="-40" width="120" height="300" fill="url(#shine)" transform="skewX(-18)"/>
    </g>
  </g>
</svg>
