<svg width="880" height="432" viewBox="0 0 880 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Chen Hong">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
  </defs>

  <style>
    .code, .lbl, .pt { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
    .code { font-size: 15px; }
    .kw  { fill: #c678dd; }
    .cls { fill: #e5c07b; }
    .at  { fill: #e06c75; }
    .st  { fill: #98c379; }
    .pn  { fill: #abb2bf; }
    .cm  { fill: #7d8590; font-style: italic; }
    .fname { fill: #8b949e; font-size: 14px; }
    .lbl { fill: #7d8590; font-size: 14px; }
    .grn { fill: #98c379; }
    .pt  { font-size: 14px; }

    .ln { opacity: 0; animation: appear .55s ease-out forwards; }
    .a0{animation-delay:.20s}.a1{animation-delay:.32s}.a2{animation-delay:.44s}
    .a3{animation-delay:.56s}.a4{animation-delay:.68s}.a5{animation-delay:.80s}
    .a6{animation-delay:.92s}.a7{animation-delay:1.04s}.a8{animation-delay:1.16s}.a9{animation-delay:1.28s}
    @keyframes appear { to { opacity: 1; } }

    .cur { fill: #6366f1; opacity: 0; animation: blink 1s steps(1) 1.5s infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .pr { animation: glowbg 6s ease-in-out infinite; }
    .pt { animation: glowtx 6s ease-in-out infinite; }
    .tok { animation: pop 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .t0{animation-delay:0s}.t1{animation-delay:.8s}.t2{animation-delay:1.6s}.t3{animation-delay:2.4s}.t4{animation-delay:3.2s}
    @keyframes glowbg { 0%,8%{fill:#161b22;stroke:#30363d} 16%,28%{fill:#312e81;stroke:#6366f1} 36%,100%{fill:#161b22;stroke:#30363d} }
    @keyframes glowtx { 0%,8%{fill:#6e7681} 16%,28%{fill:#c7d2fe} 36%,100%{fill:#6e7681} }
    @keyframes pop    { 0%,8%{transform:scale(1)} 16%,28%{transform:scale(1.07)} 36%,100%{transform:scale(1)} }
  </style>

  <rect x="1" y="1" width="878" height="430" rx="14" fill="url(#win)" stroke="#30363d"/>

  <!-- title bar -->
  <circle cx="26" cy="24" r="6.5" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6.5" fill="#ffbd2e"/>
  <circle cx="70" cy="24" r="6.5" fill="#27c93f"/>
  <text class="code fname" x="98" y="29">about_me.py</text>
  <line x1="0" y1="46" x2="880" y2="46" stroke="#21262d"/>

  <!-- code -->
  <text class="code ln a0" x="34" y="84"><tspan class="kw">class </tspan><tspan class="cls">ChenHong</tspan><tspan class="pn">(</tspan><tspan class="cls">Researcher</tspan><tspan class="pn">):</tspan></text>
  <text class="code ln a1" x="34" y="110"><tspan class="pn">    </tspan><tspan class="at">name    </tspan><tspan class="pn"> = </tspan><tspan class="st">"Chen Hong"</tspan></text>
  <text class="code ln a2" x="34" y="136"><tspan class="pn">    </tspan><tspan class="at">role    </tspan><tspan class="pn"> = </tspan><tspan class="st">"MPhil → Incoming PhD"</tspan></text>
  <text class="code ln a3" x="34" y="162"><tspan class="pn">    </tspan><tspan class="at">lab     </tspan><tspan class="pn"> = </tspan><tspan class="st">"HKUST (Guangzhou)"</tspan></text>
  <text class="code ln a4" x="34" y="188"><tspan class="pn">    </tspan><tspan class="at">advisor </tspan><tspan class="pn"> = </tspan><tspan class="st">"Prof. Xuming Hu"</tspan></text>
  <text class="code ln a5" x="34" y="214"><tspan class="pn">    </tspan><tspan class="at">research</tspan><tspan class="pn"> = [</tspan><tspan class="st">"Efficient LLMs"</tspan><tspan class="pn">,</tspan></text>
  <text class="code ln a6" x="34" y="240"><tspan class="pn">                </tspan><tspan class="st">"KV Cache Compression"</tspan><tspan class="pn">,</tspan></text>
  <text class="code ln a7" x="34" y="266"><tspan class="pn">                </tspan><tspan class="st">"Nested Learning"</tspan><tspan class="pn">]</tspan></text>
  <text class="code ln a8" x="34" y="292"><tspan class="pn">    </tspan><tspan class="at">prev    </tspan><tspan class="pn"> = [</tspan><tspan class="st">"NUS"</tspan><tspan class="pn">, </tspan><tspan class="st">"Tencent"</tspan><tspan class="pn">, </tspan><tspan class="st">"BNU-HKBU"</tspan><tspan class="pn">]</tspan></text>
  <text class="code ln a9" x="34" y="318"><tspan class="cm">    # making LLMs faster · lighter · smarter</tspan></text>
  <rect class="cur" x="432" y="304" width="9" height="18" rx="1.5"/>

  <!-- divider -->
  <line x1="20" y1="348" x2="860" y2="348" stroke="#21262d"/>

  <!-- autoregressive token strip -->
  <text class="lbl" x="34" y="380"><tspan class="grn">❯ </tspan>model.generate(profile) →</text>

  <g class="tok t0">
    <rect class="pr t0" x="34"  y="396" width="74" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text class="pt t0" x="71"  y="413" text-anchor="middle" fill="#6e7681">making</text>
  </g>
  <g class="tok t1">
    <rect class="pr t1" x="120" y="396" width="58" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text class="pt t1" x="149" y="413" text-anchor="middle" fill="#6e7681">LLMs</text>
  </g>
  <g class="tok t2">
    <rect class="pr t2" x="190" y="396" width="74" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text class="pt t2" x="227" y="413" text-anchor="middle" fill="#6e7681">faster</text>
  </g>
  <g class="tok t3">
    <rect class="pr t3" x="276" y="396" width="83" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text class="pt t3" x="317" y="413" text-anchor="middle" fill="#6e7681">lighter</text>
  </g>
  <g class="tok t4">
    <rect class="pr t4" x="371" y="396" width="83" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text class="pt t4" x="412" y="413" text-anchor="middle" fill="#6e7681">smarter</text>
  </g>
</svg>
