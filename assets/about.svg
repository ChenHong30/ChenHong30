<svg width="880" height="372" viewBox="0 0 880 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Chen Hong">
  <defs>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#f1f1f4"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#1d1d1f" flood-opacity="0.16"/>
    </filter>
    <clipPath id="card"><rect x="10" y="8" width="860" height="350" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif; }
    .title { fill: #4b4b50; font-size: 14px; font-weight: 600; }
    .name  { fill: #1d1d1f; font-size: 32px; font-weight: 700; }
    .cn    { fill: #86868b; font-size: 19px; font-weight: 500; }
    .sub   { fill: #6e6e73; font-size: 15px; }
    .stat  { fill: #6e6e73; font-size: 14px; }
    .mono  { fill: #ffffff; font-size: 36px; font-weight: 700; }
    .lab   { fill: #86868b; font-size: 14px; font-weight: 500; }
    .val   { fill: #1d1d1f; font-size: 14px; }

    .fx { opacity: 0; animation: appear .55s cubic-bezier(.2,.7,.3,1) forwards; }
    .f0{animation-delay:.15s}.f1{animation-delay:.28s}.f2{animation-delay:.41s}
    .f3{animation-delay:.60s}.f4{animation-delay:.72s}.f5{animation-delay:.84s}.f6{animation-delay:.96s}
    @keyframes appear { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

    .ring { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
    @keyframes ping { 0%{transform:scale(1);opacity:.55} 70%,100%{transform:scale(2.6);opacity:0} }

    .halo { transform-box: fill-box; transform-origin: center; animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:.0} 50%{opacity:.5} }
  </style>

  <rect x="10" y="8" width="860" height="350" rx="18" fill="#ffffff" filter="url(#sh)"/>

  <g clip-path="url(#card)">
    <rect x="10" y="8" width="860" height="350" fill="#ffffff"/>

    <!-- title bar -->
    <rect x="10" y="8" width="860" height="42" fill="url(#bar)"/>
    <line x1="10" y1="50" x2="870" y2="50" stroke="#e5e5ea"/>
    <circle cx="34" cy="29" r="6.5" fill="#ff5f57"/>
    <circle cx="55" cy="29" r="6.5" fill="#febc2e"/>
    <circle cx="76" cy="29" r="6.5" fill="#28c840"/>
    <text class="title" x="440" y="34" text-anchor="middle">Chen Hong — about</text>

    <!-- avatar -->
    <circle class="halo" cx="96" cy="142" r="52" fill="#7c3aed"/>
    <circle cx="96" cy="142" r="48" fill="url(#av)"/>
    <text class="mono" x="96" y="156" text-anchor="middle">CH</text>

    <!-- name + subtitle -->
    <text class="fx f0" x="168" y="124"><tspan class="name">Chen Hong</tspan><tspan class="cn">  陈鸿</tspan></text>
    <text class="fx f1 sub" x="170" y="152">AI Researcher · Efficient Large Language Models</text>

    <!-- status -->
    <g class="fx f2">
      <circle class="ring" cx="176" cy="176" r="5" fill="#28c840"/>
      <circle cx="176" cy="176" r="5" fill="#28c840"/>
      <text class="stat" x="190" y="181">Incoming PhD @ HKUST (Guangzhou) · 2026–2029</text>
    </g>

    <line x1="40" y1="212" x2="830" y2="212" stroke="#ececf0"/>

    <!-- info rows -->
    <g class="fx f3"><text class="lab" x="44" y="246">Advisor</text><text class="val" x="180" y="246">Prof. Xuming Hu</text></g>
    <g class="fx f4"><text class="lab" x="44" y="280">Research</text><text class="val" x="180" y="280">KV Cache Compression · Nested Learning · Test-time Adaptation</text></g>
    <g class="fx f5"><text class="lab" x="44" y="314">Experience</text><text class="val" x="180" y="314">Research Assistant @ Xiamen · Business Analyst Intern @ Tencent</text></g>
    <g class="fx f6"><text class="lab" x="44" y="348">Education</text><text class="val" x="180" y="348">M.S. @ NUS · B.S. Financial Math @ BNU-HKBU</text></g>
  </g>

  <rect x="10" y="8" width="860" height="350" rx="18" fill="none" stroke="#e3e3e8"/>
</svg>
