<svg width="880" height="300" viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Chen Hong">
  <defs>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif; }
    .name { fill: url(#ng); font-size: 36px; font-weight: 800; letter-spacing: .3px; }
    .cn   { fill: #8b949e; font-size: 20px; font-weight: 500; }
    .sub  { fill: #8b949e; font-size: 16px; }
    .stat { fill: #8b949e; font-size: 14px; }
    .mono { fill: #ffffff; font-size: 40px; font-weight: 700; }
    .lab  { fill: #7c3aed; font-size: 14px; font-weight: 600; letter-spacing: .3px; }
    .val  { fill: #8b949e; font-size: 14px; }

    .fx { opacity: 0; transform-box: fill-box; transform-origin: left center; animation: appear .55s cubic-bezier(.2,.7,.3,1) forwards; }
    .f0{animation-delay:.12s}.f1{animation-delay:.24s}.f2{animation-delay:.36s}
    .f3{animation-delay:.54s}.f4{animation-delay:.66s}.f5{animation-delay:.78s}.f6{animation-delay:.90s}
    @keyframes appear { from { opacity:0; transform: translateX(-10px); } to { opacity:1; transform: translateX(0); } }

    .ring { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
    @keyframes ping { 0%{transform:scale(1);opacity:.55} 70%,100%{transform:scale(2.6);opacity:0} }

    .halo { transform-box: fill-box; transform-origin: center; animation: glow 4.5s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:0} 50%{opacity:.45} }
  </style>

  <!-- avatar -->
  <circle class="halo" cx="78" cy="92" r="58" fill="#7c3aed"/>
  <circle cx="78" cy="92" r="52" fill="url(#av)"/>
  <text class="mono" x="78" y="107" text-anchor="middle">CH</text>

  <!-- name + subtitle -->
  <text class="fx f0" x="160" y="78"><tspan class="name">Chen Hong</tspan><tspan class="cn">  陈鸿</tspan></text>
  <text class="fx f1 sub" x="162" y="108">AI Researcher · Efficient Large Language Models</text>

  <!-- status -->
  <g class="fx f2">
    <circle class="ring" cx="170" cy="134" r="5" fill="#3fb950"/>
    <circle cx="170" cy="134" r="5" fill="#3fb950"/>
    <text class="stat" x="184" y="139">Incoming PhD @ HKUST (Guangzhou) · 2026–2029</text>
  </g>

  <line x1="22" y1="172" x2="858" y2="172" stroke="#8b949e" stroke-opacity="0.22"/>

  <!-- info rows -->
  <g class="fx f3"><text class="lab" x="24" y="206">ADVISOR</text><text class="val" x="150" y="206">Prof. Xuming Hu</text></g>
  <g class="fx f4"><text class="lab" x="24" y="236">RESEARCH</text><text class="val" x="150" y="236">KV Cache Compression · Nested Learning · Test-time Adaptation</text></g>
  <g class="fx f5"><text class="lab" x="24" y="266">EXPERIENCE</text><text class="val" x="150" y="266">Research Assistant @ Xiamen · Business Analyst Intern @ Tencent</text></g>
  <g class="fx f6"><text class="lab" x="24" y="296">EDUCATION</text><text class="val" x="150" y="296">M.S. @ NUS · B.S. Financial Math @ BNU-HKBU</text></g>
</svg>
